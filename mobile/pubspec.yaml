name: bisindo_translator
description: "BISINDO Sign Language Translator App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^18.0.2

  # ── Dependency Injection ──────────────────────────────────────
  get_it: ^9.3.0
  injectable: ^3.0.0

  # ── Firebase ──────────────────────────────────────────────────
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # ── Network ───────────────────────────────────────────────────
  dio: ^5.8.0

  # ── Local Storage ────────────────────────────────────────────
  shared_preferences: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Camera & ML ───────────────────────────────────────────────
  camera: ^0.12.1
  # tflite_flutter: ^0.11.0  # Aktifkan saat model .tflite sudah siap
  image: ^4.5.4

  # ── Text to Speech ────────────────────────────────────────────
  flutter_tts: ^4.2.0

  # ── Functional Programming ───────────────────────────────────
  dartz: ^0.10.1
  fpdart: ^1.1.0

  # ── Code Generation ───────────────────────────────────────────
  # freezed_annotation: ^2.4.4
  # json_annotation: ^4.9.0

  # ── UI & Assets ───────────────────────────────────────────────
  flutter_svg: ^2.0.17
  cached_network_image: ^4.0.3
  lottie: ^3.3.1
  shimmer: ^4.0.0
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0

  # ── Utils ─────────────────────────────────────────────────────
  intl: ^0.20.2
  connectivity_plus: ^7.3.1
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────────
  build_runner: ^2.4.15
  injectable_generator: ^3.1.3
  # freezed: ^2.5.8
  # json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/animations/
    - assets/icons/

  # Font Poppins diload otomatis oleh package google_fonts
  # Tidak perlu deklarasi manual di sini
